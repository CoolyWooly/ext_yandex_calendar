# Проверка на каждый пуш и PR. На тег vX.Y.Z — ещё и релиз с архивом для Chrome.
name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: .output/*-chrome.zip
          if-no-files-found: error

      - name: Релиз с архивом
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "Тег $TAG не совпадает с версией $version в package.json" >&2
            exit 1
          fi
          # Описание релиза — раздел этой версии из CHANGELOG.md.
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "$TAG" .output/*-chrome.zip --title "$TAG" --notes-file release-notes.md
